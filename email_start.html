<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background-color: #1e293b; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        .header { background-color: #0f172a; padding: 24px; border-bottom: 1px solid #334155; }
        .header h2 { margin: 0 0 10px 0; font-size: 20px; color: #f8fafc; }
        .badge { display: inline-block; padding: 4px 12px; font-size: 12px; font-weight: bold; border-radius: 9999px; color: #ffffff; background-color: #0284c7; text-transform: uppercase; }
        .content { padding: 24px; }
        .meta-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .meta-table td { padding: 10px 12px; border-bottom: 1px solid #334155; font-size: 14px; }
        .meta-table td.label { font-weight: 600; color: #94a3b8; width: 35%; }
        .meta-table td.value { color: #f1f5f9; word-break: break-all; }
        .footer { background-color: #0f172a; padding: 16px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Playlist Downloader Sync</h2>
            <span class="badge">TRANSFER STARTED</span>
        </div>
        <div class="content">
            <p style="color: #94a3b8; font-size: 14px;">A new automated playlist transfer job has been initiated.</p>
            <table class="meta-table">
                <tr>
                    <td class="label">Playlist URL</td>
                    <td class="value"><a href="{{ PLAYLIST_URL }}" style="color: #38bdf8;">{{ PLAYLIST_URL }}</a></td>
                </tr>
                <tr>
                    <td class="label">Destination Path</td>
                    <td class="value">{{ DOWNLOAD_DIR }}</td>
                </tr>
                <tr>
                    <td class="label">Format Target</td>
                    <td class="value">MP3 Audio (192kbps VBR)</td>
                </tr>
            </table>
        </div>
        <div class="footer">
            YoutubeSync Automation Engine
        </div>
    </div>
</body>
</html>
